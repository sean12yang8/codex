services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: acr
      POSTGRES_USER: acr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acr -d acr"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://acr:${POSTGRES_PASSWORD}@db:5432/acr
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://acr:${POSTGRES_PASSWORD}@db:5432/acr
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  app-data:
